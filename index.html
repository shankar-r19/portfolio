<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shankar Ravi</title>
  <meta name="description" content="Shankar Ravi — Technology | Education | Society. Portfolio of AR/VR, education and technology & society projects.">
  <link rel="icon" href="assets/images/logo-home.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #e3f7fd;
      --ink: #16222c;
      --ink-soft: #506473;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--sky);
      color: var(--ink);
      font-family: "Figtree", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .intro {
      position: fixed;
      left: max(24px, env(safe-area-inset-left, 0px));
      right: 24px;
      bottom: max(40px, env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      padding: 28px 32px;
      background: rgba(227, 247, 253, 0.78);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-radius: 16px;
    }
    h1 {
      font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      margin: 0 0 10px;
    }
    .tagline {
      font-size: 17px;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      margin: 0 0 24px;
    }
    .enter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 30px;
      background: var(--ink);
      color: var(--sky);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }
    .enter:hover { background: #0f6f8f; transform: translateX(4px); }
    .enter:focus-visible { outline: 2px solid #0f6f8f; outline-offset: 3px; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 20px;
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
      font-size: 14px;
    }
    .links a { color: var(--ink); text-decoration: none; border-bottom: 1px solid currentColor; }
    .links a:hover { color: #0f6f8f; }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>

  <main class="intro">
    <h1>Shankar Ravi</h1>
    <p class="tagline">Technology | Education | Society</p>
    <a class="enter" href="home.html">Enter portfolio <span aria-hidden="true">&rarr;</span></a>
    <ul class="links">
      <li><a href="ar-vr-projects.html">AR/VR Projects</a></li>
      <li><a href="education-projects.html">Education Projects</a></li>
      <li><a href="technology-and-society.html">Technology and Society</a></li>
    </ul>
  </main>

  <script>
  // Forward wave lines: Flow mode, Spectrum colour, 7 lines, speed 2.0, camera on.
  (() => {
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    const SKY = '#e3f7fd';
    // HOLD: extra seconds (timeline time) the full set of lines stays on screen before sweeping out
    const HOLD = 18, LOOP = 14 + HOLD, SPEED = 2, COUNT = 7;
    // Red, orange, yellow, green, blue, indigo, violet — yellow deepened to stay visible on the pale sky
    const RAINBOW = ['#e23a3a','#f57c1f','#e9b000','#2e9e4f','#1f6fe0','#3f3aa6','#8b3fc4'];
    const lineColour = (i, n) => RAINBOW[n <= 1 ? 0 : Math.round(i*(RAINBOW.length-1)/(n-1))];
    let t = 0, last = performance.now(), W = 0, H = 0, dpr = 1;

    function resize(){
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W*dpr; cv.height = H*dpr;
    }
    addEventListener('resize', resize); resize();

    // ---- easing + keyframes ----
    const ease = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
    const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
    function key(frames, T){
      if (T <= frames[0][0]) return frames[0].slice(1);
      for (let i = 1; i < frames.length; i++){
        const a = frames[i-1], b = frames[i];
        if (T <= b[0]){
          const k = ease((T - a[0])/(b[0] - a[0]));
          return a.slice(1).map((v,j) => v + (b[j+1]-v)*k);
        }
      }
      return frames[frames.length-1].slice(1);
    }
    // camera: [time, zoom, focusX, focusY] in stage units (0..1)
    // the hold slowly drifts between wide shots before the original exit (shifted by HOLD)
    const CAM = [[0,1,.5,.5],[2.6,1.05,.42,.42],[5,2.4,.3,.32],[6.6,2.3,.38,.36],[9.4,.82,.5,.5],
      [9.4+HOLD*.35,1.15,.58,.46],[9.4+HOLD*.7,.95,.44,.54],[9.4+HOLD,.85,.5,.5],
      [12.5+HOLD,.9,.5,.5],[LOOP,1,.5,.5]];

    // ---- line set: first pair crosses (mirrored phase), then a low arc, then extras ----
    function lineDef(i){
      const preset = [
        {base:.36, amp:.17, k:4.0, ph:2.2,           w:.0085, start:0.0,  drift:.35},
        {base:.36, amp:.17, k:4.0, ph:2.2+Math.PI,   w:.0085, start:.35,  drift:.35},
        {base:.70, amp:.14, k:3.2, ph:.5,            w:.0085, start:.8,   drift:-.3},
      ];
      if (preset[i]) return preset[i];
      const r = n => { const x = Math.sin(i*127.1+n*311.7)*43758.5453; return x-Math.floor(x); };
      return {base:.2 + r(1)*.65, amp:.08 + r(2)*.12, k:2.6 + r(3)*1.6, ph:r(4)*6.28, w:.006 + r(5)*.003, start:1 + r(6)*1.4, drift:(r(7)-.5)*.7};
    }
    const Y = (d, x, T) => d.base + d.amp*Math.sin(x*d.k + d.ph + T*d.drift) + d.amp*.05*Math.sin(x*d.k*2.1 - T*.5);

    // quadratic curves through segment midpoints, so joins have no corners
    function stroke(pts, w, color){
      if (pts.length < 2) return;
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++){
        const [x, y] = pts[i], [nx, ny] = pts[i+1];
        ctx.quadraticCurveTo(x, y, (x + nx)/2, (y + ny)/2);
      }
      const end = pts[pts.length-1];
      ctx.lineTo(end[0], end[1]);
      ctx.stroke();
    }

    // Reference choreography: draw in → push in → pull back → flow out
    // right: the visible right edge in stage units, so each line's end point stops inside the frame
    function drawFlow(T, n, right){
      for (let i = n - 1; i >= 0; i--){
        const d = lineDef(i);
        const local = T - d.start;
        const xEnd = right - .08 - (i % 3)*.05;
        const out = ease(clamp((T - 10.6 - HOLD - i*.25)/3.1));
        // draw in to xEnd, hold there, then sweep the whole line out to the right
        const head = -.05 + (xEnd + .05)*ease(clamp(local/8.6)) + (1.75 - xEnd)*out;
        const tail = -.35 + 2.1*out;
        if (head <= tail || local < 0) continue;
        const pts = [];
        const x1 = Math.min(head, 1.5);
        for (let x = Math.max(tail, -.4); x <= x1; x += .002) pts.push([x, Y(d, x, T)]);
        pts.push([x1, Y(d, x1, T)]);
        stroke(pts, d.w, lineColour(i, n));
      }
    }

    function render(){
      const T = t % LOOP;
      // Map the unit square to cover the viewport, centred
      const s = Math.max(W, H);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, H);
      ctx.setTransform(s*dpr, 0, 0, s*dpr, (W - s)/2*dpr, (H - s)/2*dpr);
      const [z, fx, fy] = key(CAM, T);
      ctx.save(); ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy);
      drawFlow(T, COUNT, 1 - (s - W)/2/s);
      ctx.restore();
    }

    function frame(now){
      const dt = Math.min(.05, (now - last)/1000); last = now;
      t += dt*SPEED;
      render();
      requestAnimationFrame(frame);
    }

    if (matchMedia('(prefers-reduced-motion: reduce)').matches){ t = 9.6 + HOLD/2; render(); addEventListener('resize', render); }
    else requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
